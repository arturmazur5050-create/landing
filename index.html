  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">

  <title>Bakery</title>

<body>

  <div class="top-section">


    <header class="header">
      <div class="container--wide">
        <nav class="menu">

          <img src="Bakery.svg" alt="logo" class="menu__logo">

          <ul class="menu__list">
            <li><a href="#">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Blog</a></li>

              <a href="#">Login /</a>

          </div>
          <button class="burger" aria-label="Открыть меню">
    <span></span>

    <span></span>
  </button>

      </div>
    </header>


    <section class="hero">

            <button class="hero__btn"><a href="">Shop Now</a></button>

            <div class="hero__social">

              <a href="#"><img src="linkedin.svg" alt=""></a>
              <a href="#"><img src="instagram.svg" alt=""></a>
            </div>
          </div>

          <div class="hero__img">
            <img class="img__cookies" src="cookies.png" alt="">

        </div>

      </div>
